<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ShopHelper Demo Store</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
    #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 8px; margin-bottom: 8px; }
    .user { color: #036; margin: 6px 0; }
    .bot { color: #060; margin: 6px 0; }
  </style>
</head>
<body>
  <h2>ShopHelper Demo Store</h2>
  <div id="messages"></div>
  <input id="chat-input" type="text" placeholder="Type your message" style="width:70%">
  <button id="send-btn">Send</button>

  <script>
    const box = document.getElementById("messages");
    function add(cls, text) {
      const d = document.createElement("div");
      d.className = cls;
      d.textContent = text;
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
    }
    document.getElementById("send-btn").onclick = async () => {
      const input = document.getElementById("chat-input");
      const text = input.value;
      if (!text) return;
      input.value = "";
      add("user", "You: " + text);
      const res = await fetch("/demo-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      add("bot", "Bot: " + data.reply);
    };
        document.getElementById("chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("send-btn").click();
    });
  </script>
</body>
</html>
